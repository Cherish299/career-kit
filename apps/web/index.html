<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerOS · 个人求职工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">CareerOS <span class="tag">个人求职操作系统</span></div>
  <nav id="tabs" class="tabs">
    <button data-tab="profile" class="tab active">👤 个人中心</button>
    <button data-tab="jobs" class="tab">📡 岗位</button>
    <button data-tab="match" class="tab">🎯 匹配</button>
    <button data-tab="pipeline" class="tab">📨 投递看板</button>
    <button data-tab="resume" class="tab">📄 简历版本</button>
    <button data-tab="interview" class="tab">🧠 面试准备</button>
    <button data-tab="offer" class="tab">🛰️ Offer 导入</button>
  </nav>
</header>
<main>
  <section id="panel-profile" class="panel active">
    <div class="card">
      <h2>导入 Resume Kit 画像</h2>
      <p class="hint">粘贴简历工作台导出的 JSON（或选文件），一键结构化到 Profile。</p>
      <textarea id="importText" rows="8" placeholder='{"app":"resume-kit","resume":{"basic":{...}}}'></textarea>
      <div class="row">
        <input type="file" id="importFile" accept=".json">
        <button id="btnImport" class="btn primary">导入画像</button>
      </div>
      <div id="importResult" class="result"></div>
    </div>
    <div class="card">
      <h2>当前画像</h2>
      <div id="profileList"></div>
    </div>
    <div class="card">
      <h2>公开主页设置</h2>
      <div class="row">
        <select id="publicProfileSelect"></select>
        <select id="publicVisibilitySelect">
          <option value="private">private</option>
          <option value="shared">shared</option>
          <option value="public">public</option>
        </select>
      </div>
      <div class="grid">
        <label>公开 slug <input id="publicSlugInput" placeholder="如 zhang-san-ai"></label>
        <div>
          <div class="muted">公开字段</div>
          <div id="publicFieldsGroup" class="checkbox-grid">
            <label><input type="checkbox" value="display_name"> display_name</label>
            <label><input type="checkbox" value="summary"> summary</label>
            <label><input type="checkbox" value="skills"> skills</label>
            <label><input type="checkbox" value="projects"> projects</label>
          </div>
        </div>
      </div>
      <div class="row">
        <button id="btnSavePublicProfile" class="btn primary">保存公开设置</button>
        <button id="btnLoadPublicProfile" class="btn">查看公开页</button>
        <button id="btnCopyPublicLink" class="btn">复制分享链接</button>
      </div>
      <div id="publicProfileResult" class="result"></div>
    </div>
  </section>

  <section id="panel-jobs" class="panel">
    <div class="card">
      <h2>录入岗位</h2>
      <div class="grid">
        <label>公司 <input id="jCompany" placeholder="示例科技公司"></label>
        <label>职位 <input id="jTitle" placeholder="AI 应用开发工程师"></label>
        <label>地点 <input id="jLocation" placeholder="深圳"></label>
        <label>截止日期 <input id="jDeadline" placeholder="2027-09-30 或 招满为止"></label>
        <label>来源 URL（可选）<input id="jUrl" placeholder="https://..."></label>
      </div>
      <label>JD 要求 <textarea id="jReq" rows="4" placeholder="熟悉 Python / FastAPI / RAG ..."></textarea></label>
      <button id="btnAddJob" class="btn primary">保存岗位</button>
      <div id="jobResult" class="result"></div>
    </div>
    <div class="card">
      <div class="row"><h2>岗位列表</h2><label><input id="jobFavoriteOnly" type="checkbox"> 只看收藏</label><button id="btnRefreshJobs" class="btn">刷新</button></div>
      <div id="jobList"></div>
    </div>
    <div class="card">
      <div class="row"><h2>岗位提醒</h2><button id="btnRefreshAlerts" class="btn">刷新提醒</button></div>
      <div id="jobAlertList"></div>
    </div>
  </section>

  <section id="panel-match" class="panel">
    <div class="card">
      <h2>可解释匹配</h2>
      <div class="row">
        <select id="mProfile"></select>
        <select id="mJob"></select>
        <button id="btnMatch" class="btn primary">分析匹配</button>
      </div>
      <div id="matchResult"></div>
    </div>
  </section>

  <section id="panel-pipeline" class="panel">
    <div class="card">
      <h2>创建投递</h2>
      <div class="row">
        <select id="pProfile"></select>
        <select id="pJob"></select>
        <button id="btnAddApp" class="btn primary">创建投递</button>
      </div>
      <div id="appResult" class="result"></div>
    </div>
    <div class="card">
      <h2>投递看板</h2>
      <div id="pipelineList"></div>
    </div>
  </section>

  <section id="panel-resume" class="panel">
    <div class="card">
      <h2>简历版本（母版 → 岗位副本）</h2>
      <div class="row">
        <select id="rProfile"></select>
        <select id="rJob"></select>
        <input id="rName" placeholder="版本名（如：RAG 岗-定向版）">
        <button id="btnFork" class="btn primary">生成副本</button>
      </div>
      <div id="resumeResult" class="result"></div>
    </div>
    <div class="card">
      <h2>版本列表</h2>
      <div id="resumeList"></div>
    </div>
  </section>

  <section id="panel-interview" class="panel">
    <div class="card">
      <h2>面试准备计划</h2>
      <div class="row">
        <select id="iApplication"></select>
        <button id="btnGenerateInterview" class="btn primary">生成准备计划</button>
      </div>
      <div id="interviewPlanResult" class="result"></div>
    </div>
  </section>

  <section id="panel-offer" class="panel">
    <div class="card">
      <h2>Offer 情报局筛选与导出</h2>
      <p class="hint">填写筛选参数后，可直接在页面里调用后端预览 Offer 情报局结果，也可下载 JSON / Markdown / CSV 报告。</p>
      <div class="grid">
        <label>导航 <select id="oNavigationNames"></select></label>
        <label>标题关键词 <input id="oTitleKeywords" placeholder="AI,算法,机器学习,后端"></label>
        <label>全文关键词 <input id="oJobKeywords" placeholder="大模型,RAG,Python,数据,Agent"></label>
        <label>公司关键词 <input id="oCompanyKeywords" placeholder="乐狗,华为,百度,腾讯,阿里"></label>
        <label>地点关键词 <input id="oLocationKeywords" placeholder="杭州,深圳,全国"></label>
        <label>毕业年份 <input id="oGraduateYears" placeholder="2027,2028"></label>
        <label>招聘批次 <input id="oBatchKeywords" placeholder="秋招,实习"></label>
        <label>每页条数 <input id="oLimit" placeholder="20" value="20"></label>
        <label>抓取页数 <input id="oPageLimit" placeholder="1" value="1"></label>
        <label>总条数上限 <input id="oTotalLimit" placeholder="20" value="20"></label>
        <label>报告格式
          <select id="oReportFormat">
            <option value="json">JSON</option>
            <option value="md">Markdown</option>
            <option value="csv">CSV</option>
          </select>
        </label>
        <label>输出文件（可选） <input id="oOutputPath" placeholder="tmp/offer-report.csv"></label>
      </div>
      <label><input id="oAutoName" type="checkbox"> 自动按时间戳命名文件</label>
      <div class="row">
        <button id="btnOfferPreview" class="btn primary">页面预览</button>
        <button id="btnOfferDownload" class="btn">下载报告</button>
        <button id="btnOfferWrite" class="btn">一键正式导入</button>
        <button id="btnOfferPreviewCmd" class="btn">生成预览命令</button>
        <button id="btnOfferImport" class="btn">生成导入命令</button>
        <button id="btnOfferCopy" class="btn">复制命令</button>
      </div>
      <div id="offerResult" class="result"></div>
      <div id="offerImportSummary" class="result"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
