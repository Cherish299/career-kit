<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerOS Public Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="public-body">
  <main class="public-main">
    <section class="public-hero card">
      <div class="muted">CareerOS Public Profile</div>
      <h1 id="publicName">加载中...</h1>
      <p id="publicSummary" class="public-summary"></p>
      <div id="publicMeta" class="muted"></div>
    </section>

    <section class="card">
      <h2>项目与经历</h2>
      <p class="hint">只展示公开字段白名单允许的项目、实习或研究经历。</p>
      <div id="publicExperiences" class="public-list"></div>
    </section>

    <section class="card">
      <h2>技能</h2>
      <p class="hint">仅展示当前公开的技能标签与熟练度。</p>
      <div id="publicSkills" class="public-list"></div>
    </section>
  </main>
  <script src="public.js"></script>
</body>
</html>
