name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (unified)
        run: npm run build

      - name: Test (unified)
        run: |
          npm ci --prefix legacy/resume-kit/scripts/smoke
          npm run test

      - name: Secret & path scan
        run: |
          echo "== scan for API keys / private keys =="
          BEG="-----BEGIN "; KEY="PRIVATE KEY"
          if grep -rInE "sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|${BEG}(RSA |EC |OPENSSH )?${KEY}" --include="*.js" --include="*.json" --include="*.md" --include="*.yml" --include="*.yaml" --exclude="ci.yml" --exclude-dir=node_modules .; then
            echo "::error::possible secret found in repository"; exit 1
          fi
          echo "== scan for personal absolute paths =="
          if grep -rInE "C:\\\\Users\\\\[A-Za-z]+|/home/[a-z]+/" --include="*.js" --include="*.json" --include="*.md" --include="*.yml" --include="*.yaml" --exclude="ci.yml" --exclude-dir=node_modules .; then
            echo "::error::personal absolute path found in repository"; exit 1
          fi
          echo "secret & path scan passed"
